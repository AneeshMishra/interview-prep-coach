[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is overridden at runtime from app.config.get_settings()
# (see alembic/env.py) — this placeholder is only used if env.py somehow
# isn't invoked (e.g. some third-party tooling).
sqlalchemy.url = sqlite:///./interview_prep.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
