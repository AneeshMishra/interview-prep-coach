version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - IPC_DATABASE_URL=sqlite:////data/interview_prep.db
      - IPC_QDRANT_URL=http://qdrant:6333
      - IPC_OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - backend_data:/data
    depends_on:
      - qdrant
      - ollama

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
  qdrant_data:
  ollama_data:
